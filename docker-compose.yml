services:
  # Redis - Caching and Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Relational Database
  postgres:
    image: postgres:15
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${PG_PASSWORD:-aegis_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TimescaleDB - Time-series Database for Metrics
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: aegis-timescale
    environment:
      POSTGRES_DB: aegis_metrics
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-aegis_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j - Graph Database for Knowledge Graph
  neo4j:
    image: neo4j:5
    container_name: aegis-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-aegis_dev_password}
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Agents Service - Python-based analysis agents
  agents:
    build:
      context: ./packages/agents
      dockerfile: docker/Dockerfile
    container_name: aegis-agents
    ports:
      - "8081:8081"
    environment:
      - AGENT_PORT=8081
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://aegis:${PG_PASSWORD:-aegis_dev_password}@postgres:5432/aegis
      - REDIS_ENABLED=false
    networks:
      - aegis-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Orchestrator Service - Python-based orchestration
  orchestrator:
    build:
      context: ./packages/orchestrator
      dockerfile: docker/Dockerfile
    container_name: aegis-orchestrator
    ports:
      - "8082:8082"
    environment:
      - ORCHESTRATOR_PORT=8082
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://aegis:${PG_PASSWORD:-aegis_dev_password}@postgres:5432/aegis
      - AGENTS_URL=http://agents:8081
      - TIMESCALE_URL=postgresql://aegis:${TIMESCALE_PASSWORD:-aegis_dev_password}@timescaledb:5432/aegis_metrics
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-aegis_dev_password}
    networks:
      - aegis-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      agents:
        condition: service_started
      neo4j:
        condition: service_healthy

  # Signaling Server - WebSocket signaling for WebRTC
  signaling:
    build:
      context: ./packages/signaling
      dockerfile: Dockerfile
    container_name: aegis-signaling
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
    networks:
      - aegis-network
    depends_on:
      redis:
        condition: service_healthy

  # Candidate UI - React-based candidate interface
  candidate-ui:
    build:
      context: ./packages/candidate-ui
      dockerfile: Dockerfile
    container_name: aegis-candidate-ui
    ports:
      - "3002:3000"
    environment:
      - VITE_API_URL=http://localhost:8083
    networks:
      - aegis-network
    depends_on:
      signaling:
        condition: service_started

  # HR Dashboard - React-based HR interface
  hr-dashboard:
    build:
      context: ./packages/hr-dashboard
      dockerfile: Dockerfile
    container_name: aegis-hr-dashboard
    ports:
      - "3003:3000"
    environment:
      - VITE_API_URL=http://localhost:8082
      - VITE_SIGNALING_URL=http://localhost:8083
    networks:
      - aegis-network
    depends_on:
      orchestrator:
        condition: service_started
      signaling:
        condition: service_started

networks:
  aegis-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  timescale-data:
  neo4j-data:
