apiVersion: apps/v1
kind: Deployment
metadata:
  name: candidate-ui
  namespace: aegis-lens
  labels:
    app: candidate-ui
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: candidate-ui
  template:
    metadata:
      labels:
        app: candidate-ui
        version: v1
    spec:
      containers:
      - name: candidate-ui
        image: aegis-lens/candidate-ui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        envFrom:
        - configMapRef:
            name: candidate-ui-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
