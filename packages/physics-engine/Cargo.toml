[package]
name = "physics-engine"
version = "0.1.0"
edition = "2021"
authors = ["Lucieran-Raven"]
description = "Unified Physics Engine for Aegis Lens - Integrates CHRONOS, ECHO, IRIS, and LIPSYNC pipelines"
license = "MIT"
repository = "https://github.com/Lucieran-Raven/aegis-lens"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Local pipeline dependencies
chronos = { path = "../chronos" }
echo = { path = "../echo" }
iris = { path = "../iris" }
lipsync = { path = "../lipsync" }

# WASM dependencies
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
