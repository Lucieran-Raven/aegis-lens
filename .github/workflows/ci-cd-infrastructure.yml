name: CI/CD - Infrastructure

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'packages/**'
      - 'kubernetes/**'
      - '.github/workflows/ci-cd-infrastructure.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'packages/**'
      - 'kubernetes/**'
      - '.github/workflows/ci-cd-infrastructure.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: lucieran-raven/aegis-lens

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - candidate-ui
          - hr-dashboard
          - agents
          - orchestrator
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.package }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Set Dockerfile path
        id: dockerfile
        run: |
          if [ "${{ matrix.package }}" = "agents" ] || [ "${{ matrix.package }}" = "orchestrator" ]; then
            echo "path=packages/${{ matrix.package }}/docker/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=packages/${{ matrix.package }}/Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: packages/${{ matrix.package }}
          file: ${{ steps.dockerfile.outputs.path }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

