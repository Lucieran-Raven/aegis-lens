name: Candidate UI CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'packages/candidate-ui/**'
      - '.github/workflows/ci-candidate-ui.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'packages/candidate-ui/**'
      - '.github/workflows/ci-candidate-ui.yml'

jobs:
  test:
    name: Test Candidate UI
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: packages/candidate-ui/package-lock.json

      - name: Install dependencies
        working-directory: packages/candidate-ui
        run: npm ci

      - name: Type check
        working-directory: packages/candidate-ui
        run: npm run type-check

      - name: Lint
        working-directory: packages/candidate-ui
        run: npm run lint

      - name: Run tests
        working-directory: packages/candidate-ui
        run: npm test

  build:
    name: Build Candidate UI
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: packages/candidate-ui/package-lock.json

      - name: Install dependencies
        working-directory: packages/candidate-ui
        run: npm ci

      - name: Build
        working-directory: packages/candidate-ui
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: candidate-ui-dist
          path: packages/candidate-ui/dist
          retention-days: 7

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: aegislens/candidate-ui
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: packages/candidate-ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
